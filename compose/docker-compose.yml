# Local stack: the three venue simulators, a market maker per venue, the
# market recorder and MinIO as its S3 target.
#
#   make up      # build (if needed) and start
#   make logs
#   make down
#
# `make build` (and so `make up`) builds the images with images/service/build.sh,
# which pins siblings at resolved commits and labels each image with them;
# `make ps` shows those labels. The `build:` sections below are the fallback
# for plain `docker compose up --build` (siblings at their default branch, no
# commit labels). Either way the base image is
# ghcr.io/winterchill-trading/oxcaml-base:latest (pull it, or `make base`).
name: winterchill

x-service-build: &service-build
  context: ../images/service
  args: &service-args
    BASE_IMAGE: ${BASE_IMAGE:-ghcr.io/winterchill-trading/oxcaml-base:latest}
    REF: ${REF:-main}

x-mm: &mm
  image: ghcr.io/winterchill-trading/market-maker:local
  restart: unless-stopped
  environment:
    BINANCE_API_KEY: sim-key
    BINANCE_API_SECRET: sim-secret
    BYBIT_API_KEY: sim-key
    BYBIT_API_SECRET: sim-secret

services:
  hl-sim:
    image: ghcr.io/winterchill-trading/hl-sim:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: hl-sim
        BIN: hl-sim
    # -leaders: simulated leader accounts for the copy-trading services
    # (`make up-copy`); they trade against the noise traders and the market maker.
    command: ["-port", "3000", "-seed", "42", "-leaders", "${HL_SIM_LEADERS:-5}"]
    ports: ["${HL_SIM_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "-d", '{"type":"meta"}', "http://localhost:3000/info"]
      interval: 5s
      retries: 20

  binance-sim:
    image: ghcr.io/winterchill-trading/binance-sim:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: binance-sim
        BIN: binance-sim
    command: ["-port", "3300", "-seed", "42"]
    ports: ["${BINANCE_SIM_PORT:-3300}:3300"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3300/fapi/v1/ping"]
      interval: 5s
      retries: 20

  bybit-sim:
    image: ghcr.io/winterchill-trading/bybit-sim:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: bybit-sim
        BIN: bybit-sim
    command: ["-port", "3400", "-seed", "42"]
    ports: ["${BYBIT_SIM_PORT:-3400}:3400"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3400/v5/market/time"]
      interval: 5s
      retries: 20

  mm-hyperliquid:
    <<: *mm
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: market-maker
        BIN: market-maker
    command: ["-venue", "hyperliquid", "-network", "local", "-base-url", "http://hl-sim:3000"]
    depends_on:
      hl-sim: { condition: service_healthy }

  mm-binance:
    <<: *mm
    command: ["-venue", "binance", "-network", "local", "-base-url", "http://binance-sim:3300"]
    depends_on:
      binance-sim: { condition: service_healthy }
      mm-hyperliquid: { condition: service_started }

  mm-bybit:
    <<: *mm
    command: ["-venue", "bybit", "-network", "local", "-base-url", "http://bybit-sim:3400"]
    depends_on:
      bybit-sim: { condition: service_healthy }
      mm-hyperliquid: { condition: service_started }

  # Copy trading, under the `copy` profile (`make up-copy`, docs/copytrading.md).
  #
  # hl-leaderboard-collect: every LEADERBOARD_INTERVAL seconds collects the
  # simulator's leaderboard, the top accounts' fills and state, and ranks them
  # into leaders.json; hl-leaderboard serves that file (re-read on change).
  hl-leaderboard-collect:
    image: ghcr.io/winterchill-trading/hl-leaderboard:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: hl-leaderboard
        BIN: hl-leaderboard
    profiles: [copy]
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "-c"]
    environment:
      LEADERBOARD_INTERVAL: ${LEADERBOARD_INTERVAL:-60}
    # The sim's leaders start with 100000 USD and trade for minutes, not
    # weeks: no account-value floor, a one-day lookback, one round trip.
    command:
      - |
        dir=/var/lib/hl-leaderboard
        while true; do
          if hl-leaderboard collect -out "$$dir" -network local -base-url http://hl-sim:3000 \
               -min-account-value 0 -lookback-days 1 \
             && hl-leaderboard rank -in "$$dir" -out "$$dir/leaders.json" -min-trades 1; then
            echo "leaderboard ranked"
          else
            echo "leaderboard collect FAILED" >&2
          fi
          sleep "$$LEADERBOARD_INTERVAL"
        done
    volumes:
      - leaderboard-data:/var/lib/hl-leaderboard
    depends_on:
      hl-sim: { condition: service_healthy }

  hl-leaderboard:
    image: ghcr.io/winterchill-trading/hl-leaderboard:local
    profiles: [copy]
    restart: unless-stopped
    command: ["serve", "-port", "8090", "-dir", "/var/lib/hl-leaderboard"]
    volumes:
      - leaderboard-data:/var/lib/hl-leaderboard
    ports: ["${LEADERBOARD_PORT:-8090}:8090"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 5s
      retries: 20
    depends_on:
      hl-leaderboard-collect: { condition: service_started }

  # hl-copy-api: wallet login, agent keys, follows. It writes follow configs
  # (and sealed agent keys) to the copy-data volume, which the engine watches.
  # HL_COPY_MASTER_KEY seals the agent keys: the default is a fixed dev key,
  # fine for the simulator only.
  hl-copy-api:
    image: ghcr.io/winterchill-trading/hl-copy-api:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: hl-copy-api
        BIN: hl-copy-api
    profiles: [copy]
    restart: unless-stopped
    environment:
      HL_COPY_MASTER_KEY: ${HL_COPY_MASTER_KEY:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
    command:
      - -port
      - "8080"
      - -exchange-url
      - ${COPY_EXCHANGE_URL:-http://hl-sim:3000}
      - -leaderboard-url
      - http://hl-leaderboard:8090
      - -engine-url
      - http://hl-copy-engine:9930
      - -state-dir
      - /var/lib/hl-copy-api/state
      - -config-dir
      - /var/lib/hl-copy-api/configs
      # The origin browsers sign in on: hl-copy-web, which proxies /api here.
      - -public-url
      - http://localhost:${COPY_WEB_PORT:-8000}
      - -allow-origin
      - http://localhost:${COPY_WEB_PORT:-8000}
    volumes:
      - copy-data:/var/lib/hl-copy-api
    ports: ["${COPY_API_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 20
    depends_on:
      hl-sim: { condition: service_healthy }
      hl-leaderboard: { condition: service_started }

  # hl-copy-engine: one follower per config file, IOC orders on hl-sim.
  # -unsigned acts as the follower through X-Address (hl-sim without
  # -strict-signatures). /metrics, /status and /healthz on 9930.
  hl-copy-engine:
    image: ghcr.io/winterchill-trading/hl-copy-engine:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: hl-copy-engine
        BIN: hl-copy-engine
    profiles: [copy]
    restart: unless-stopped
    command:
      - run
      - -base-url
      - ${COPY_EXCHANGE_URL:-http://hl-sim:3000}
      - -configs-dir
      - /var/lib/hl-copy-api/configs
      - -journal-dir
      - /var/lib/hl-copy-engine/journals
      - -port
      - "9930"
      - -unsigned
    volumes:
      # Mounted where the API image created it, read-only: the API owns it.
      # The API starts first, so the fresh volume takes that directory's owner.
      - copy-data:/var/lib/hl-copy-api:ro
      - copy-journals:/var/lib/hl-copy-engine
    ports: ["127.0.0.1:${COPY_ENGINE_PORT:-9930}:9930"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9930/healthz"]
      interval: 5s
      retries: 20
    depends_on:
      hl-copy-api: { condition: service_healthy }

  # hl-copy-web: the js_of_ocaml app (the image's web target) on nginx, with
  # the API proxied under /api. Open http://localhost:8000/.
  hl-copy-web:
    image: ghcr.io/winterchill-trading/hl-copy-web:local
    build:
      <<: *service-build
      target: web
      args:
        <<: *service-args
        REPO: hl-copy-web
        BIN: ""
    profiles: [copy]
    restart: unless-stopped
    volumes:
      - ./copy-web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${COPY_WEB_PORT:-8000}:8080"]
    depends_on:
      hl-copy-api: { condition: service_healthy }

  # Hyperliquid testnet in a box, under the `testnet` profile (`make
  # up-testnet`, docs/testnet-box.md): an hl-sim whose books follow
  # Hyperliquid mainnet's public feed (read-only, no keys), leader accounts,
  # hl-mm quoting each anchored coin and a recorder recording the result.
  testnet-sim:
    image: ghcr.io/winterchill-trading/hl-sim:local
    profiles: [testnet]
    restart: unless-stopped
    command:
      - -port
      - "3000"
      - -seed
      - "42"
      - -anchor
      - hyperliquid:BTC
      - -anchor
      - hyperliquid:ETH
      - -anchor
      - hyperliquid:SOL
      - -leaders
      - "${TESTNET_LEADERS:-5}"
    ports: ["${TESTNET_SIM_PORT:-3600}:3000"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "-d", '{"type":"meta"}', "http://localhost:3000/info"]
      interval: 5s
      retries: 20

  testnet-mm-btc:
    image: ghcr.io/winterchill-trading/hl-mm:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: hl-mm
        BIN: hl-mm
    profiles: [testnet]
    restart: unless-stopped
    # Unsigned requests acting as -address (hl-sim's X-Address); one account
    # per coin so the two inventories stay apart.
    command: ["-base-url", "http://testnet-sim:3000", "-coin", "BTC",
              "-address", "0x00000000000000000000000000000000000000b1"]
    depends_on:
      testnet-sim: { condition: service_healthy }

  testnet-mm-eth:
    image: ghcr.io/winterchill-trading/hl-mm:local
    profiles: [testnet]
    restart: unless-stopped
    command: ["-base-url", "http://testnet-sim:3000", "-coin", "ETH",
              "-address", "0x00000000000000000000000000000000000000b2"]
    depends_on:
      testnet-sim: { condition: service_healthy }
      testnet-mm-btc: { condition: service_started }

  testnet-recorder:
    image: ghcr.io/winterchill-trading/market-recorder:local
    profiles: [testnet]
    restart: unless-stopped
    command: ["run", "-config", "/etc/market-recorder/recorder.sexp"]
    volumes:
      - ./recorder-testnet.sexp:/etc/market-recorder/recorder.sexp:ro
      - testnet-recorder-data:/var/lib/market-recorder
    ports: ["${TESTNET_RECORDER_PORT:-9110}:9100"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/healthz"]
      interval: 10s
      start_period: 30s
      retries: 6
    depends_on:
      testnet-sim: { condition: service_healthy }

  minio:
    # Upstream stopped publishing MinIO images; pgsty/minio is a maintained build.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["${MINIO_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # One-shot: create the bucket the recorder uploads into.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc mb --ignore-existing local/market-data

  market-recorder:
    image: ghcr.io/winterchill-trading/market-recorder:local
    build:
      <<: *service-build
      args:
        <<: *service-args
        REPO: market-recorder
        BIN: market-recorder
        RUNTIME_PACKAGES: rclone
    command: ["run", "-config", "/etc/market-recorder/recorder.sexp"]
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_MINIO_TYPE: s3
      RCLONE_CONFIG_MINIO_PROVIDER: Minio
      RCLONE_CONFIG_MINIO_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # memtrace, off while empty; `make up-memtrace` sets both (see
      # docs/runtime-tuning.md). The trace lands on the recorder volume.
      MEMTRACE: ${RECORDER_MEMTRACE:-}
      MEMTRACE_RATE: ${RECORDER_MEMTRACE_RATE:-}
    volumes:
      - ./recorder.sexp:/etc/market-recorder/recorder.sexp:ro
      - recorder-data:/var/lib/market-recorder
    ports: ["${RECORDER_PORT:-9100}:9100"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9100/healthz"]
      interval: 10s
      start_period: 30s
      retries: 6
    depends_on:
      hl-sim: { condition: service_healthy }
      binance-sim: { condition: service_healthy }
      bybit-sim: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Day close, under the `day-close` profile (`make up-day-close`): every
  # DAY_CLOSE_INTERVAL seconds converts yesterday's norm/ logs on the
  # recorder volume into parquet/ (idempotent), then runs `market-data check`.
  # A failed check logs `day-close check FAILED` with the FAIL lines above it
  # (`docker compose logs day-close`) and the loop carries on.
  day-close:
    image: ghcr.io/winterchill-trading/market-data:local
    profiles: [day-close]
    restart: unless-stopped
    entrypoint: ["/usr/bin/tini", "--", "/bin/bash", "-c"]
    environment:
      DAY_CLOSE_INTERVAL: ${DAY_CLOSE_INTERVAL:-3600}
      DAY_CLOSE_MAX_GAP: ${DAY_CLOSE_MAX_GAP:-1m}
    command:
      - |
        dir=/var/lib/market-recorder
        while true; do
          if market-data day-close -dir "$$dir"; then
            if market-data check -dir "$$dir" -max-gap "$$DAY_CLOSE_MAX_GAP"; then
              echo "day-close check ok"
            else
              echo "day-close check FAILED" >&2
            fi
          else
            echo "day-close FAILED" >&2
          fi
          sleep "$$DAY_CLOSE_INTERVAL"
        done
    volumes:
      - recorder-data:/var/lib/market-recorder
    depends_on:
      market-recorder: { condition: service_started }

  # Collectors, under the `monitoring` profile (`make up-monitoring`): socket,
  # FD and RSS history next to the recorder's own /metrics.
  #
  # cadvisor: per container. container_sockets, container_file_descriptors,
  # container_memory_rss, container_threads, and TCP connections by state
  # (container_network_tcp_usage_total, off by default in cadvisor).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: [monitoring]
    # Not privileged: reading other processes' /proc/<pid>/fd needs
    # SYS_PTRACE, and cgroup and mount stats need SYS_ADMIN.
    cap_add: [SYS_ADMIN, SYS_PTRACE]
    # Without /dev/kmsg (privileged only) cadvisor just skips OOM events.
    # FD and socket counts come from /proc/<pid>/fd of each container's
    # processes, which only the host PID namespace shows.
    pid: host
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --enable_metrics=cpu,memory,network,process,tcp
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      # cadvisor reads Docker containers through containerd. Rancher Desktop's
      # dockerd runs its own containerd here; on a Linux host with the system
      # containerd use CADVISOR_CONTAINERD=/run/containerd/containerd.sock.
      - --containerd=${CADVISOR_CONTAINERD:-/var/run/docker/containerd/containerd.sock}
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports: ["127.0.0.1:${CADVISOR_PORT:-8088}:8080"]

  # node-exporter: the Docker VM (or host) as a whole: node_sockstat_*,
  # node_netstat_Tcp_*, node_tcp_connection_states, node_filefd_allocated.
  # Host network so it sees the host's sockets, hence its own port, bound to
  # loopback so it is not reachable from the LAN.
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: [monitoring]
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:${NODE_EXPORTER_PORT:-9101}
      - --collector.tcpstat
      - --collector.processes
    volumes: ["/:/host:ro,rslave"]

  # Keeps 5 s samples of the three above for a day. Host network, like
  # node-exporter, so it reaches the loopback-only listeners; it scrapes the
  # default host ports (see prometheus.yml).
  prometheus:
    image: quay.io/prometheus/prometheus:v3.15.0
    profiles: [monitoring]
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9090}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  minio-data:
  recorder-data:
  leaderboard-data:
  copy-data:
  copy-journals:
  testnet-recorder-data:
