# hl-copy-web in the compose `copy` profile: the static app, with hl-copy-api
# behind /api/ on the same origin (no CORS, one port to open). The app reads
# its API root from ?api=, so a bare / redirects to /?api=/api; /?mock=1 (any
# query without api) keeps the mock fixtures.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location = / {
        if ($args = "") {
            return 302 /?api=/api;
        }
        try_files /index.html =404;
    }

    location /api/ {
        proxy_pass http://hl-copy-api:8080/;
        proxy_http_version 1.1;
        # /api/ws: the API's websocket pushes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
