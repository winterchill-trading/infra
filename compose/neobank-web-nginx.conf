# neobank-web in the compose `neobank` profile: the static app, with
# neobank-api behind /api/ on the same origin. With no query the app uses
# /api; /?mock=1 runs on its built-in mock bank.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # Relative redirects: the browser keeps the host port, not the container's 8080.
    absolute_redirect off;
    index index.html;

    location /api/ {
        proxy_pass http://neobank-api:8080/;
        proxy_http_version 1.1;
        # /api/ws: the API's websocket pushes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}
