# Scrape config for the compose `monitoring` profile. Prometheus runs on the
# host network and scrapes the default host ports on loopback.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: market-recorder
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
  # The `testnet` profile's recorder (down unless `make up-testnet`).
  - job_name: testnet-recorder
    static_configs: [{ targets: ["127.0.0.1:9110"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["127.0.0.1:8088"] }]
    metric_relabel_configs:
      # Keep the compose services, drop the rest of the host's containers.
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop
  - job_name: node
    static_configs: [{ targets: ["127.0.0.1:9101"] }]
