# Scrape config for the compose `monitoring` profile.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: market-recorder
    static_configs: [{ targets: ["market-recorder:9100"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["cadvisor:8080"] }]
    metric_relabel_configs:
      # Keep the compose services, drop the rest of the host's containers.
      - source_labels: [container_label_com_docker_compose_service]
        regex: ""
        action: drop
  - job_name: node
    # node-exporter runs on the host network.
    static_configs: [{ targets: ["host.docker.internal:9101"] }]
