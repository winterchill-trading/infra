name: service-images
# Builds the service images from each repo's current main and pushes them to
# GHCR tagged with the repo commit (first 12 characters), multi-arch. The
# Helm defaults reference these tags; bump them after a run.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Space-separated repos to build (empty: all)"
        default: ""
concurrency:
  group: service-images
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  # Resolve every repo to one commit up front, so both architectures build
  # the same source.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      revs: ${{ steps.revs.outputs.revs }}
      matrix: ${{ steps.revs.outputs.matrix }}
    steps:
      - id: revs
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          all='hl-sim binance-sim bybit-sim market-maker market-recorder market-data'
          revs='{}' list='[]'
          for repo in ${REPOS:-$all}; do
            sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY_OWNER}/${repo}.git" HEAD | cut -f1)
            test -n "${sha}"
            revs=$(jq -c --arg r "${repo}" --arg s "${sha}" '. + {($r): $s}' <<< "${revs}")
            list=$(jq -c --arg r "${repo}" '. + [$r]' <<< "${list}")
          done
          echo "revs=${revs}" >> "$GITHUB_OUTPUT"
          echo "matrix=${list}" >> "$GITHUB_OUTPUT"
          jq . <<< "${revs}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.resolve.outputs.matrix) }}
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The base image unpacks to about 12 GB.
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        env:
          REPO: ${{ matrix.repo }}
          REF: ${{ fromJSON(needs.resolve.outputs.revs)[matrix.repo] }}
          PLATFORM: linux/${{ matrix.arch }}
          TAG: ${{ env.REGISTRY }}/${{ matrix.repo }}
        run: |
          extra=()
          [[ ${REPO} == market-recorder ]] && extra+=(--build-arg RUNTIME_PACKAGES=rclone)
          # `market-data check` runs in the day-close job and shells out to duckdb.
          [[ ${REPO} == market-data ]] && extra+=(--build-arg DUCKDB_VERSION=1.5.6)
          images/service/build.sh "${REPO}" "${REPO}" "${extra[@]}" \
            --output "type=image,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file /tmp/meta.json
          mkdir -p /tmp/digests
          digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.repo }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.repo }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the commit
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.repo }}
          SHA: ${{ fromJSON(needs.resolve.outputs.revs)[matrix.repo] }}
        run: |
          refs=()
          for d in *; do refs+=("${IMAGE}@sha256:${d}"); done
          docker buildx imagetools create -t "${IMAGE}:${SHA:0:12}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${SHA:0:12}"
