name: base-image
on:
  push:
    branches: [main]
    paths:
      - images/oxcaml-base/**
      - .github/workflows/base-image.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
concurrency:
  group: base-image-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oxcaml-base
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/oxcaml-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=oxcaml-base
          cache-to: type=gha,mode=max,scope=oxcaml-base
