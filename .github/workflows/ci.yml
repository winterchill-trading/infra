name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hadolint action bundles 2.12, which rejects `ADD --keep-git-dir`.
      - name: hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint images/oxcaml-base/Dockerfile images/service/Dockerfile
      - run: shellcheck -x images/service/build.sh scripts/*.sh test-actions/*.sh .github/actions/ox-setup/*.sh
      - run: scripts/test-check-pins.sh
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - run: helm lint charts/winterchill
      - run: helm lint charts/winterchill -f charts/winterchill/values-dev.yaml
      - name: rendered example is up to date
        run: |
          helm template winterchill charts/winterchill -f charts/winterchill/values-dev.yaml > /tmp/rendered.yaml
          diff -u charts/rendered-example.yaml /tmp/rendered.yaml
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose/docker-compose.yml config -q
  # Exercises the ox-setup action on a real consumer; the step timings of
  # this job are the cold and warm numbers in docs/ci.md.
  ox-setup-hl-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: winterchill-trading/hl-sim
          path: hl-sim
      - id: ox
        uses: ./.github/actions/ox-setup
        with:
          working-directory: hl-sim
          pins: |
            fixed-decimal https://github.com/winterchill-trading/fixed-decimal.git
            exchange-core https://github.com/winterchill-trading/exchange-core.git
            hl-protocol https://github.com/winterchill-trading/hl-protocol.git
            order-book https://github.com/winterchill-trading/order-book.git
            exchange-core-engine https://github.com/winterchill-trading/exchange-core.git
      - run: echo "switch cache ${{ steps.ox.outputs.cache-hit }} (${{ steps.ox.outputs.cache-key }})"
      - run: opam exec -- dune build
        working-directory: hl-sim
      - run: opam exec -- dune test
        working-directory: hl-sim
