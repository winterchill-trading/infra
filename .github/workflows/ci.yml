name: ci
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hadolint action bundles 2.12, which rejects `ADD --keep-git-dir`.
      - name: hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint images/oxcaml-base/Dockerfile images/service/Dockerfile
      - run: shellcheck images/service/build.sh
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - run: helm lint charts/winterchill
      - run: helm lint charts/winterchill -f charts/winterchill/values-dev.yaml
      - name: rendered example is up to date
        run: |
          helm template winterchill charts/winterchill -f charts/winterchill/values-dev.yaml > /tmp/rendered.yaml
          diff -u charts/rendered-example.yaml /tmp/rendered.yaml
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose/docker-compose.yml config -q
