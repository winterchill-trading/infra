# Default values: production-style recorders against venue mainnets.
# See values-dev.yaml for the local profile with simulators.

imageRegistry: ghcr.io/winterchill-trading
# Image tags are the first 12 characters of the commit the image was built
# from (the service-images workflow pushes them); `latest` is rejected.
imagePullPolicy: IfNotPresent
imagePullSecrets: []

recorder:
  image:
    repository: market-recorder
    tag: ddffef1be979
  # Directory inside the pod holding raw/ and norm/ files (the PVC mount).
  dataDir: /var/lib/market-recorder
  httpPort: 9100
  # Deleting files once uploaded keeps the PVC a buffer, not an archive.
  deleteAfterUpload: true
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  # Statistical allocation profile (memtrace) of every recorder: sets MEMTRACE
  # to <dataDir>/<file> on the data volume, so the trace survives a container
  # restart until the next start overwrites it. See docs/runtime-tuning.md.
  memtrace:
    enabled: false
    file: memtrace.ctf
    # Sampled fraction of allocated words; 1e-4 suits captures of minutes to hours.
    rate: "1e-4"
  persistence:
    size: 20Gi
    storageClassName: ""
  nodeSelector: {}
  tolerations: []
  # One Deployment (and PVC, ConfigMap, Service) per entry. `endpoint` is the
  # recorder's Endpoint sexp: Mainnet, Testnet, (Local (port N)) or
  # (Custom (base_url URL)). Rendered with `tpl`, so {{ .Release.Name }} works.
  venues:
    - name: binance
      venue: Binance
      symbols: [BTCUSDT, ETHUSDT]
      streams: [Trades, Bbo, L2, Funding]
      endpoint: Mainnet
    - name: bybit
      venue: Bybit
      symbols: [BTCUSDT, ETHUSDT]
      streams: [Trades, Bbo, L2, Funding]
      endpoint: Mainnet
    - name: hyperliquid
      venue: Hyperliquid
      symbols: [BTC, ETH]
      streams: [Trades, L2, Funding]
      endpoint: Mainnet

# Upload target for closed files, through rclone's S3 backend.
s3:
  bucket: winterchill-market-data
  # Key prefix inside the bucket; files land at <prefix>/<rel path>.
  prefix: ""
  region: ap-northeast-1
  # Empty for AWS; set for MinIO or another S3-compatible store.
  endpoint: ""
  provider: AWS
  # true: take credentials from the EC2 instance role (rclone env_auth) and
  # create no Secret. The default, since production runs on EC2.
  useInstanceRole: true
  # Use a pre-created Secret with keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
  existingSecret: ""
  accessKeyId: ""
  secretAccessKey: ""

dayClose:
  enabled: true
  image:
    repository: market-data
    tag: 1977bfab1718
  # 00:20 UTC, after the day's last files have rolled.
  schedule: "20 0 * * *"
  # Upload the day's parquet/ tables after the close.
  upload: true
  rcloneImage: rclone/rclone:1.71.1
  # `market-data check` after the close (needs an image built with
  # DUCKDB_VERSION, see service-images.yml). Violations fail the Job.
  check:
    enabled: true
    # Longest allowed recv_ts gap per instrument (Core span: 30s, 1m, 5m).
    maxGap: 1m
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }

# Venue simulators, for the dev profile only.
sims:
  enabled: false
  # Overrides every entry's tag when set (values-dev.yaml: local).
  image:
    tag: ""
  seed: 42
  list:
    - name: hl-sim
      tag: 300e00d37d9d
      port: 3000
      # Leader accounts for the copy-trading services (copy.enabled). The flag
      # needs an hl-sim image from 8cbc145 or later; bump the tag before
      # enabling sims with the default tags.
      extraArgs: ["-leaders", "5"]
      probe: { path: /info, body: '{"type":"meta"}' }
    - name: binance-sim
      tag: 05db961cd03a
      port: 3300
      probe: { path: /fapi/v1/ping }
    - name: bybit-sim
      tag: 8b887f0bd62e
      port: 3400
      probe: { path: /v5/market/time }

# Copy-trading platform (docs/copytrading.md): leader ranking, the mirroring
# engine and the API with the web app. Off by default; it trades against
# hl-sim or Hyperliquid testnet only (the engine refuses mainnet URLs).
copy:
  enabled: false
  # Overrides every copy image's tag when set (values-dev.yaml: local).
  image:
    tag: ""
  # Hyperliquid API root the services talk to; rendered with `tpl`.
  baseUrl: "http://{{ .Release.Name }}-hl-sim:3000"
  leaderboard:
    image:
      repository: hl-leaderboard
      tag: ""
    port: 8090
    # Seconds between two collect-and-rank runs.
    interval: 60
    minTrades: 1
    # Extra `collect` flags, rendered with `tpl`. Against hl-sim the leaders
    # are minutes old: no account-value floor and a one-day lookback.
    collectArgs:
      - -network
      - local
      - -base-url
      - "{{ tpl .Values.copy.baseUrl . }}"
      - -min-account-value
      - "0"
      - -lookback-days
      - "1"
    resources:
      requests: { cpu: 20m, memory: 128Mi }
      limits: { memory: 512Mi }
    persistence:
      size: 2Gi
  # The web app's origin as browsers reach it: the sign-in message names it
  # and the API allows it for CORS.
  publicUrl: http://localhost:8000
  # Key sealing the stored agent keys (64 hex digits). Prefer an existing
  # Secret with the key HL_COPY_MASTER_KEY; `value` creates one.
  masterKey:
    existingSecret: ""
    value: ""
  # Follow configs, sealed agent keys, follow records and engine journals.
  persistence:
    size: 1Gi
  api:
    image:
      repository: hl-copy-api
      tag: ""
    port: 8080
    extraArgs: []
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  engine:
    image:
      repository: hl-copy-engine
      tag: ""
    # /metrics, /status, /healthz.
    port: 9930
    # How orders are signed: `-unsigned` acts through X-Address and only works
    # on hl-sim without -strict-signatures; `-agent-key-env VAR` signs every
    # follow with one agent key from the environment.
    extraArgs: ["-unsigned"]
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
  web:
    image:
      repository: hl-copy-web
      tag: ""

# PostgreSQL for the applications that keep state in SQL: one StatefulSet with
# a PersistentVolumeClaim, databases neobank and hl_copy (owner roles of the
# same names) created on first start by files/postgres/10-databases.sh.
postgres:
  enabled: false
  image: postgres:18-alpine
  port: 5432
  # Prefer an existing Secret with the keys POSTGRES_PASSWORD,
  # NEOBANK_DB_PASSWORD and HL_COPY_DB_PASSWORD; the values below create one.
  # They are read once, when the volume is initialised.
  auth:
    existingSecret: ""
    postgresPassword: ""
    neobankPassword: ""
    hlCopyPassword: ""
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Host socket and FD collector (node-exporter), one pod per node with the host
# network and PID namespace. Off by default. Recorders only dial out, so keep
# the port closed in the node's security group and scrape it from inside the
# cluster.
monitoring:
  enabled: false
  nodeExporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    # Host port. Not node-exporter's usual 9100: that is the recorder's port,
    # and on Rancher Desktop compose publishes it on the same VM.
    port: 9101
    collectors: [sockstat, filefd, netstat, meminfo, cpu]
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }
