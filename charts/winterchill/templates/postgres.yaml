{{- if .Values.postgres.enabled }}
{{- $secret := .Values.postgres.auth.existingSecret | default (printf "%s-postgres" .Release.Name) }}
{{- if not .Values.postgres.auth.existingSecret }}
---
# Superuser and per-database passwords. Set postgres.auth.existingSecret (same
# three keys) for anything but development.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.auth.postgresPassword or postgres.auth.existingSecret" .Values.postgres.auth.postgresPassword | quote }}
  NEOBANK_DB_PASSWORD: {{ required "postgres.auth.neobankPassword" .Values.postgres.auth.neobankPassword | quote }}
  HL_COPY_DB_PASSWORD: {{ required "postgres.auth.hlCopyPassword" .Values.postgres.auth.hlCopyPassword | quote }}
{{- end }}
---
# The compose init script (compose/postgres/initdb.d), copied into the chart
# because Helm only reads files under it; `make lint` checks the two match.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-initdb
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
data:
  10-databases.sh: |
    {{- .Files.Get "files/postgres/10-databases.sh" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-postgres
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: postgres
      annotations:
        # A changed init script only matters on an empty volume, but rolling
        # the pod keeps the mounted copy in step with the chart.
        checksum/initdb: {{ .Files.Get "files/postgres/10-databases.sh" | sha256sum }}
    spec:
      # uid 70 is the postgres user of the alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: POSTGRES_USER
              value: postgres
          envFrom:
            - secretRef:
                name: {{ $secret }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Postgres 18 keeps PGDATA in /var/lib/postgresql/18/docker; the
            # claim is the parent, as in compose.
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      # Postgres checkpoints on SIGTERM (smart shutdown) before exiting.
      terminationGracePeriodSeconds: 60
      volumes:
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgres-initdb
            defaultMode: 0755
  # The claim outlives the StatefulSet: `helm uninstall` keeps it.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/name: postgres
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
