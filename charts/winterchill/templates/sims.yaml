{{- if .Values.sims.enabled }}
{{- range .Values.sims.list }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    {{- include "winterchill.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: {{ .name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sim
          image: {{ include "winterchill.image" (dict "root" $ "image" (dict "repository" .name "tag" ($.Values.sims.image.tag | default .tag))) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          args:
            - -port
            - {{ .port | quote }}
            - -seed
            - {{ $.Values.sims.seed | quote }}
            {{- range .extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .port }}
          {{- if .probe.body }}
          # POST probe: httpGet cannot send a body.
          readinessProbe:
            exec:
              command: ["curl", "-sf", "-d", {{ .probe.body | quote }}, "http://localhost:{{ .port }}{{ .probe.path }}"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["curl", "-sf", "-d", {{ .probe.body | quote }}, "http://localhost:{{ .port }}{{ .probe.path }}"]
            periodSeconds: 20
          {{- else }}
          readinessProbe:
            httpGet: { path: {{ .probe.path }}, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ .probe.path }}, port: http }
            periodSeconds: 20
          {{- end }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  labels:
    {{- include "winterchill.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
{{- end }}
{{- end }}
