{{- if .Values.monitoring.enabled }}
{{- $ne := .Values.monitoring.nodeExporter }}
# Host-level socket and FD collector: node_sockstat_*, node_netstat_Tcp_*,
# node_filefd_allocated, plus memory and CPU; every other collector is off. Per-container sockets,
# FDs and RSS come from the kubelet's built-in cAdvisor
# (/api/v1/nodes/<node>/proxy/metrics/cadvisor: container_sockets,
# container_file_descriptors, container_memory_rss), so no cAdvisor here.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-node-exporter
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
    app.kubernetes.io/name: node-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: node-exporter
    spec:
      # The host's network namespace is the one whose sockets matter.
      hostNetwork: true
      hostPID: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: node-exporter
          image: {{ $ne.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --path.rootfs=/host
            - --web.listen-address=:{{ $ne.port }}
            - --collector.disable-defaults
            {{- range $ne.collectors }}
            - --collector.{{ . }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $ne.port }}
          readinessProbe:
            httpGet: { path: /, port: metrics }
            periodSeconds: 30
          resources:
            {{- toYaml $ne.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: root
          hostPath: { path: / }
      tolerations:
        - operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-node-exporter
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
    app.kubernetes.io/name: node-exporter
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: node-exporter
  ports:
    - name: metrics
      port: {{ $ne.port }}
      targetPort: metrics
{{- end }}
