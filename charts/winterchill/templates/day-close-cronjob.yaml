{{- if .Values.dayClose.enabled }}
{{- range .Values.recorder.venues }}
---
# Converts yesterday's norm/ event logs on this venue's buffer volume into
# parquet/ tables (`market-data day-close`, idempotent), then runs the
# data-quality assertions over them (`market-data check`) and uploads them.
# A failed check fails the Job: its log prints a FAIL line per check, and
# kube-state-metrics exposes it as kube_job_status_failed.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $.Release.Name }}-day-close-{{ .name }}
  labels:
    {{- include "winterchill.labels" $ | nindent 4 }}
    app.kubernetes.io/name: day-close
    winterchill/venue: {{ .name }}
spec:
  schedule: {{ $.Values.dayClose.schedule | quote }}
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/name: day-close
            winterchill/venue: {{ .name }}
        spec:
          restartPolicy: OnFailure
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          # The buffer volume is ReadWriteOnce: run next to the recorder.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: {{ $.Release.Name }}
                      app.kubernetes.io/name: market-recorder
                      winterchill/venue: {{ .name }}
          {{- if or $.Values.dayClose.upload $.Values.dayClose.check.enabled }}
          initContainers:
          {{- else }}
          containers:
          {{- end }}
            - name: day-close
              image: {{ include "winterchill.image" (dict "root" $ "image" $.Values.dayClose.image) }}
              imagePullPolicy: {{ $.Values.imagePullPolicy }}
              args: ["day-close", "-dir", {{ $.Values.recorder.dataDir | quote }}]
              resources:
                {{- toYaml $.Values.dayClose.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ $.Values.recorder.dataDir }}
          {{- if or $.Values.dayClose.upload $.Values.dayClose.check.enabled }}
          containers:
          {{- end }}
          {{- if $.Values.dayClose.check.enabled }}
            # Runs beside the upload: a quality failure is reported, but the
            # day's tables are still shipped.
            - name: check
              image: {{ include "winterchill.image" (dict "root" $ "image" $.Values.dayClose.image) }}
              imagePullPolicy: {{ $.Values.imagePullPolicy }}
              args:
                - check
                - -dir
                - {{ $.Values.recorder.dataDir | quote }}
                - -max-gap
                - {{ $.Values.dayClose.check.maxGap | quote }}
              resources:
                {{- toYaml $.Values.dayClose.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ $.Values.recorder.dataDir }}
                  readOnly: true
          {{- end }}
          {{- if $.Values.dayClose.upload }}
            - name: upload
              image: {{ $.Values.dayClose.rcloneImage }}
              args:
                - copy
                - {{ $.Values.recorder.dataDir | quote }}
                - {{ include "winterchill.s3Remote" $ | quote }}
                - --include
                - "**/parquet/**"
              env:
                {{- include "winterchill.rcloneEnv" $ | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: {{ $.Values.recorder.dataDir }}
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          {{- end }}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ $.Release.Name }}-recorder-{{ .name }}
            - name: tmp
              emptyDir: {}
{{- end }}
{{- end }}
