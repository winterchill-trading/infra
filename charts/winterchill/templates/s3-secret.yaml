{{- if and (not .Values.s3.useInstanceRole) (not .Values.s3.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-s3
  labels:
    {{- include "winterchill.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "s3.accessKeyId is required unless s3.useInstanceRole or s3.existingSecret is set" .Values.s3.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "s3.secretAccessKey is required" .Values.s3.secretAccessKey | quote }}
{{- end }}
