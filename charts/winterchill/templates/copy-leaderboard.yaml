{{- if .Values.copy.enabled }}
{{- with .Values.copy.leaderboard }}
---
# Collection directory: raw lines, parquet and leaders.json; `collect` resumes
# from it, so it outlives the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $.Release.Name }}-hl-leaderboard
  labels:
    {{- include "winterchill.labels" $ | nindent 4 }}
    app.kubernetes.io/name: hl-leaderboard
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-hl-leaderboard
  labels:
    {{- include "winterchill.labels" $ | nindent 4 }}
    app.kubernetes.io/name: hl-leaderboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/name: hl-leaderboard
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/name: hl-leaderboard
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        # Collects and ranks every `interval` seconds; serve re-reads
        # leaders.json when it changes.
        - name: collect
          image: {{ include "winterchill.image" (dict "root" $ "image" (dict "repository" .image.repository "tag" ($.Values.copy.image.tag | default .image.tag))) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: ["/usr/bin/tini", "--", "/bin/bash", "-c"]
          args:
            - |
              dir=/var/lib/hl-leaderboard
              while true; do
                if hl-leaderboard collect -out "$dir" "$@" \
                   && hl-leaderboard rank -in "$dir" -out "$dir/leaders.json" -min-trades {{ .minTrades }}; then
                  echo "leaderboard ranked"
                else
                  echo "leaderboard collect FAILED" >&2
                fi
                sleep {{ .interval }}
              done
            - collect
            {{- range .collectArgs }}
            - {{ tpl . $ | quote }}
            {{- end }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/hl-leaderboard
        - name: serve
          image: {{ include "winterchill.image" (dict "root" $ "image" (dict "repository" .image.repository "tag" ($.Values.copy.image.tag | default .image.tag))) }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          args: ["serve", "-port", {{ .port | quote }}, "-dir", "/var/lib/hl-leaderboard"]
          ports:
            - name: http
              containerPort: {{ .port }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/hl-leaderboard
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-hl-leaderboard
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-hl-leaderboard
  labels:
    {{- include "winterchill.labels" $ | nindent 4 }}
    app.kubernetes.io/name: hl-leaderboard
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/name: hl-leaderboard
  ports:
    - name: http
      port: {{ .port }}
      targetPort: http
{{- end }}
{{- end }}
