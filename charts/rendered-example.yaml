# Source: winterchill/templates/copy.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: winterchill-hl-copy-web
  labels:
    app.kubernetes.io/part-of: winterchill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: winterchill
    helm.sh/chart: winterchill-0.1.0
    app.kubernetes.io/name: hl-copy-web
data:
  # Same layout as compose/copy-web-nginx.conf: the app, the API under /api/.
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        # Relative redirects: the browser keeps the host port (8000), not the
        # container's 8080.
        absolute_redirect off;
        location = / {
            if ($args = "") {
                return 302 /?api=/api;
            }
            index index.html;
        }
        location /api/ {
            proxy_pass http://winterchill-hl-copy:8080/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
        }
    }
