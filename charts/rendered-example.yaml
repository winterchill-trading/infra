# Source: winterchill/templates/sims.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: winterchill-hl-sim
  labels:
    app.kubernetes.io/part-of: winterchill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: winterchill
    helm.sh/chart: winterchill-0.1.0
    app.kubernetes.io/name: hl-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: winterchill
      app.kubernetes.io/name: hl-sim
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: winterchill
        app.kubernetes.io/name: hl-sim
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: sim
          image: ghcr.io/winterchill-trading/hl-sim:local
          imagePullPolicy: IfNotPresent
          args: ["-port", "3000", "-seed", "42"]
          ports:
            - name: http
              containerPort: 3000
          # POST probe: httpGet cannot send a body.
          readinessProbe:
            exec:
              command: ["curl", "-sf", "-d", "{\"type\":\"meta\"}", "http://localhost:3000/info"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["curl", "-sf", "-d", "{\"type\":\"meta\"}", "http://localhost:3000/info"]
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
