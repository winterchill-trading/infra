# Source: winterchill/templates/copy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: winterchill-hl-copy
  labels:
    app.kubernetes.io/part-of: winterchill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: winterchill
    helm.sh/chart: winterchill-0.1.0
    app.kubernetes.io/name: hl-copy
spec:
  replicas: 1
  # One engine per follow directory: never two pods placing orders.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: winterchill
      app.kubernetes.io/name: hl-copy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: winterchill
        app.kubernetes.io/name: hl-copy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/winterchill-trading/hl-copy-api:local
          imagePullPolicy: IfNotPresent
          args:
            - -port
            - "8080"
            - -exchange-url
            - "http://winterchill-hl-sim:3000"
            - -leaderboard-url
            - "http://winterchill-hl-leaderboard:8090"
            - -engine-url
            - "http://localhost:9930"
            - -state-dir
            - /var/lib/hl-copy/state
            - -config-dir
            - /var/lib/hl-copy/configs
            - -public-url
            - "http://localhost:8000"
            - -allow-origin
            - "http://localhost:8000"
          envFrom:
            - secretRef:
                name: winterchill-hl-copy
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
