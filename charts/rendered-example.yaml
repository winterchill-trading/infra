# Source: winterchill/templates/recorder-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: winterchill-recorder-binance
  labels:
    app.kubernetes.io/part-of: winterchill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: winterchill
    helm.sh/chart: winterchill-0.1.0
    app.kubernetes.io/name: market-recorder
    winterchill/venue: binance
spec:
  replicas: 1
  # One writer per buffer volume: never run old and new pods side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: winterchill
      app.kubernetes.io/name: market-recorder
      winterchill/venue: binance
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: winterchill
        app.kubernetes.io/name: market-recorder
        winterchill/venue: binance
      annotations:
        checksum/config: c9271ffc46b944e2ab825120cd8a84733424321adacdca55aa002ddbd421987a
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 60
      containers:
        - name: recorder
          image: ghcr.io/winterchill-trading/market-recorder:local
          imagePullPolicy: IfNotPresent
          args: ["run", "-config", "/etc/market-recorder/recorder.sexp"]
          env:
            # Root filesystems are read-only: keep rclone's config and cache in /tmp.
            - name: RCLONE_CONFIG
              value: /tmp/rclone.conf
            - name: RCLONE_CACHE_DIR
              value: /tmp/rclone
            - name: RCLONE_CONFIG_S3_TYPE
              value: s3
            - name: RCLONE_CONFIG_S3_PROVIDER
              value: "Minio"
            - name: RCLONE_CONFIG_S3_REGION
              value: "us-east-1"
            - name: RCLONE_CONFIG_S3_ENDPOINT
              value: "http://host.rancher-desktop.internal:9000"
            - name: RCLONE_CONFIG_S3_ENV_AUTH
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: winterchill-s3, key: AWS_ACCESS_KEY_ID }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: winterchill-s3, key: AWS_SECRET_ACCESS_KEY }
          ports:
            - name: http
              containerPort: 9100
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: data
              mountPath: /var/lib/market-recorder
            - name: config
              mountPath: /etc/market-recorder
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: winterchill-recorder-binance
        - name: config
          configMap:
            name: winterchill-recorder-binance
        - name: tmp
          emptyDir: {}
