          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: winterchill
                      app.kubernetes.io/name: market-recorder
                      winterchill/venue: bybit
