  labels:
    app.kubernetes.io/part-of: winterchill
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: winterchill
    helm.sh/chart: winterchill-0.1.0
    app.kubernetes.io/name: day-close
    winterchill/venue: binance
spec:
  schedule: "*/30 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: winterchill
            app.kubernetes.io/name: day-close
            winterchill/venue: binance
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          # The buffer volume is ReadWriteOnce: run next to the recorder.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: winterchill
                      app.kubernetes.io/name: market-recorder
                      winterchill/venue: binance
          initContainers:
            - name: day-close
              image: ghcr.io/winterchill-trading/market-data:local
              imagePullPolicy: IfNotPresent
              args: ["day-close", "-dir", "/var/lib/market-recorder"]
              resources:
                limits:
                  memory: 2Gi
                requests:
                  cpu: 200m
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /var/lib/market-recorder
          containers:
            # Runs beside the upload: a quality failure is reported, but the
            # day's tables are still shipped.
            - name: check
              image: ghcr.io/winterchill-trading/market-data:local
              imagePullPolicy: IfNotPresent
              args:
                - check
                - -dir
                - "/var/lib/market-recorder"
                - -max-gap
                - "1m"
              resources:
                limits:
                  memory: 2Gi
                requests:
                  cpu: 200m
                  memory: 512Mi
              volumeMounts:
                - name: data
                  mountPath: /var/lib/market-recorder
                  readOnly: true
            - name: upload
              image: rclone/rclone:1.71.1
              args:
                - copy
                - "/var/lib/market-recorder"
                - "s3:market-data"
                - --include
                - "**/parquet/**"
              env:
                # Root filesystems are read-only: keep rclone's config and cache in /tmp.
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                - name: RCLONE_CACHE_DIR
                  value: /tmp/rclone
                - name: RCLONE_CONFIG_S3_TYPE
                  value: s3
                - name: RCLONE_CONFIG_S3_PROVIDER
                  value: "Minio"
                - name: RCLONE_CONFIG_S3_REGION
                  value: "us-east-1"
                - name: RCLONE_CONFIG_S3_ENDPOINT
                  value: "http://host.rancher-desktop.internal:9000"
                - name: RCLONE_CONFIG_S3_ENV_AUTH
                  value: "true"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: winterchill-s3, key: AWS_ACCESS_KEY_ID }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: winterchill-s3, key: AWS_SECRET_ACCESS_KEY }
              volumeMounts:
                - name: data
                  mountPath: /var/lib/market-recorder
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: winterchill-recorder-binance
            - name: tmp
              emptyDir: {}
