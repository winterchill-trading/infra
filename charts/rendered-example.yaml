      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: winterchill
        app.kubernetes.io/name: postgres
      annotations:
        # A changed init script only matters on an empty volume, but rolling
        # the pod keeps the mounted copy in step with the chart.
        checksum/initdb: 813536b44a59798d9d5f3067d53c03952e4f7478d44ce4eb3f89b599a72d12af
    spec:
      # uid 70 is the postgres user of the alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: "postgres:18-alpine"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: postgres
          envFrom:
            - secretRef:
                name: winterchill-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, postgres]
            periodSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Postgres 18 keeps PGDATA in /var/lib/postgresql/18/docker; the
            # claim is the parent, as in compose.
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      # Postgres checkpoints on SIGTERM (smart shutdown) before exiting.
      terminationGracePeriodSeconds: 60
      volumes:
        - name: initdb
          configMap:
            name: winterchill-postgres-initdb
            defaultMode: 0755
  # The claim outlives the StatefulSet: `helm uninstall` keeps it.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/instance: winterchill
          app.kubernetes.io/name: postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi

